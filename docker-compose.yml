services:
  student-management-system:
    build: .
    container_name: student-management-system
    ports:
      - "5000:5000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      DATABASE_PATH: /app/data/students.db
    volumes:
      - student_data:/app/data
    restart: unless-stopped

volumes:
  student_data:
